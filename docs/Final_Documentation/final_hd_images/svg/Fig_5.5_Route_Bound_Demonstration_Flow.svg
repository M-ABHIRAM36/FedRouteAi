 stroke="#7cc79a" stroke-width="1.6" filter="url(#sh)"/><text x="817.5" y="151.5" font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937" dominant-baseline="middle">Simulate on map</text><text x="817.5" y="167.75" font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#5b6472" dominant-baseline="middle">vehicles + state</text><rect x="300" y="270" width="400" height="60" rx="10" fill="#fff" stroke="#e08a8a" stroke-width="1.6" filter="url(#sh)"/><text x="500" y="291.25" font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#dc2626" dominant-baseline="middle">Scenario truth kept OUT of model features</text><text x="500" y="307.75" font-family="'Segoe UI','Inter',system-ui,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6472" dominant-baseline="middle">demonstration ≠ ground truth</text><line x1="245" y1="260" x2="430" y2="270" stroke="#8a97a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="700" y1="260" x2="560" y2="270" stroke="#8a97a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/></svg>