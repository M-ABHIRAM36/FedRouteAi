<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>
.title{font-family:'Times New Roman',serif;font-weight:700;font-size:22px;fill:#000}
.head{font-family:'Times New Roman',serif;font-weight:700;font-size:15px;fill:#000}
.body{font-family:'Times New Roman',serif;font-size:13px;fill:#000}
.small{font-family:'Times New Roman',serif;font-size:11px;fill:#000}
.box{fill:#fff;stroke:#000;stroke-width:2}
.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#000;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><text x="800" y="32" text-anchor="middle" class="title">Historical Traffic Memory and Causal Windows</text><text x="800" y="55" text-anchor="middle" class="small">Baseline construction uses normal prehistory; each prediction reads only shifted prior windows and current context.</text><rect x="40" y="90" width="1520" height="215" class="dash" fill="none"/><text x="54" y="112" class="head">TEMPORAL RECORDS FOR ONE SEGMENT</text><rect x="100" y="150" width="180" height="86" class="box" style="fill:#e8e8e8"/><text x="190" y="174" text-anchor="middle" class="head">normal prehistory</text><text x="190" y="198" text-anchor="middle" class="small">baseline source</text><path d="M280 193 L340 193" class="arrow"/><rect x="340" y="150" width="180" height="86" class="box" style="fill:#e8e8e8"/><text x="430" y="174" text-anchor="middle" class="head">baseline</text><text x="430" y="198" text-anchor="middle" class="small">mean/std/count</text><path d="M520 193 L580 193" class="arrow"/><rect x="580" y="150" width="180" height="86" class="box" style="fill:#e8e8e8"/><text x="670" y="174" text-anchor="middle" class="head">t-3</text><text x="670" y="198" text-anchor="middle" class="small">prior window</text><path d="M760 193 L820 193" class="arrow"/><rect x="820" y="150" width="180" height="86" class="box" style="fill:#e8e8e8"/><text x="910" y="174" text-anchor="middle" class="head">t-2</text><text x="910" y="198" text-anchor="middle" class="small">prior window</text><path d="M1000 193 L1060 193" class="arrow"/><rect x="1060" y="150" width="180" height="86" class="box" style="fill:#e8e8e8"/><text x="1150" y="174" text-anchor="middle" class="head">t-1</text><text x="1150" y="198" text-anchor="middle" class="small">prior window</text><path d="M1240 193 L1300 193" class="arrow"/><rect x="1300" y="150" width="180" height="86" class="box" style="fill:#dcdcdc"/><text x="1390" y="174" text-anchor="middle" class="head">CURRENT t</text><text x="1390" y="198" text-anchor="middle" class="small">inference state</text><text x="800" y="275" text-anchor="middle" class="small">shifted causal window: t-3, t-2, t-1 -&gt; current t</text><rect x="40" y="345" width="730" height="245" class="dash" fill="none"/><text x="54" y="367" class="head">FEATURE MEMORY BUILD</text><rect x="75" y="405" width="285" height="92" class="box" style="fill:#e8e8e8"/><text x="217" y="429" text-anchor="middle" class="head">Normal prehistory filter</text><text x="217" y="453" text-anchor="middle" class="small">known normal windows</text><text x="217" y="468" text-anchor="middle" class="small">exclude current event windows</text><rect x="445" y="405" width="285" height="92" class="box" style="fill:#f2f2f2"/><text x="587" y="429" text-anchor="middle" class="head">Baseline aggregation</text><text x="587" y="453" text-anchor="middle" class="small">speed / variability / count</text><text x="587" y="468" text-anchor="middle" class="small">segment and time context</text><path d="M360 451 L445 451" class="arrow"/><rect x="260" y="525" width="330" height="44" class="box" style="fill:#dcdcdc"/><text x="425" y="549" text-anchor="middle" class="head">Persist historical memory rows</text><path d="M587 497 L425 525" class="arrow"/><rect x="815" y="345" width="745" height="245" class="dash" fill="none"/><text x="829" y="367" class="head">CAUSALITY GUARANTEE</text><rect x="850" y="405" width="300" height="92" class="box" style="fill:#e8e8e8"/><text x="1000" y="429" text-anchor="middle" class="head">Allowed for prediction at t</text><text x="1000" y="453" text-anchor="middle" class="small">historical baseline</text><text x="1000" y="468" text-anchor="middle" class="small">t-3, t-2, t-1</text><text x="1000" y="483" text-anchor="middle" class="small">current telemetry</text><rect x="1200" y="405" width="320" height="92" class="box" style="fill:#f2f2f2"/><text x="1360" y="429" text-anchor="middle" class="head">Excluded from prediction at t</text><text x="1360" y="453" text-anchor="middle" class="small">future windows</text><text x="1360" y="468" text-anchor="middle" class="small">current/future abnormal values</text><text x="1360" y="483" text-anchor="middle" class="small">labels or scenario names</text><path d="M1150 451 L1200 451" class="arrow"/><text x="1175" y="444" text-anchor="middle" class="small">no future leakage</text><text x="800" y="650" text-anchor="middle" class="small">The runtime cache supplements request-order history; durable database rows remain the source of prior context.</text></svg>