</style><text x="800" y="32" text-anchor="middle" class="title">Backend Service and Repository Layers</text><text x="800" y="55" text-anchor="middle" class="small">One-directional ownership keeps request parsing, business rules, database access, and models separate.</text><rect x="40" y="90" width="850" height="470" class="dash" fill="none"/><text x="54" y="112" class="head">BACKEND REQUEST PATH</text><rect x="80" y="145" width="350" height="82" class="box" style="fill:#e8e8e8"/><text x="255" y="169" text-anchor="middle" class="head">API / endpoint layer</text><text x="255" y="193" text-anchor="middle" class="small">FastAPI routers and schemas</text><text x="255" y="208" text-anchor="middle" class="small">parse request -&gt; call service</text><rect x="500" y="145" width="350" height="82" class="box" style="fill:#dcdcdc"/><text x="675" y="169" text-anchor="middle" class="head">Service layer</text><text x="675" y="193" text-anchor="middle" class="small">ingestion | Geo V2 prediction</text><text x="675" y="208" text-anchor="middle" class="small">routing | demo | federated status</text><path d="M430 186 L500 186" class="arrow"/><rect x="80" y="285" width="350" height="82" class="box" style="fill:#f2f2f2"/><text x="255" y="309" text-anchor="middle" class="head">Repository layer</text><text x="255" y="333" text-anchor="middle" class="small">GeoV2Repository</text><text x="255" y="348" text-anchor="middle" class="small">segment/event/ping/live repositories</text><rect x="500" y="285" width="350" height="82" class="box" style="fill:#e8e8e8"/><text x="675" y="309" text-anchor="middle" class="head">ML subsystem</text><text x="675" y="333" text-anchor="middle" class="small">feature contract + model store</text><text x="675" y="348" text-anchor="middle" class="small">artifact validation + inference</text><path d="M675 227 L675 285" class="arrow"/><path d="M255 227 L255 285" class="arrow"/><rect x="80" y="425" width="350" height="82" class="box" style="fill:#f2f2f2"/><text x="255" y="449" text-anchor="middle" class="head">Models and schemas</text><text x="255" y="473" text-anchor="middle" class="small">SQLAlchemy database models</text><text x="255" y="488" text-anchor="middle" class="small">Pydantic API contracts</text><rect x="500" y="425" width="350" height="82" class="box" style="fill:#dcdcdc"/><text x="675" y="449" text-anchor="middle" class="head">Routing graph cache</text><text x="675" y="473" text-anchor="middle" class="small">canonical directed graph</text><text x="675" y="488" text-anchor="middle" class="small">distance-based shortest path</text><path d="M255 367 L255 425" class="arrow"/><path d="M675 367 L675 425" class="arrow"/><rect x="950" y="90" width="610" height="470" class="dash" fill="none"/><text x="964" y="112" class="head">PERSISTENCE AND EXTERNAL EFFECTS</text><rect x="990" y="155" width="530" height="90" class="box" style="fill:#dcdcdc"/><text x="1255" y="179" text-anchor="middle" class="head">PostgreSQL + PostGIS</text><text x="1255" y="203" text-anchor="middle" class="small">GPS pings | live ingestion | historical memory</text><text x="1255" y="218" text-anchor="middle" class="small">events | predictions | segments | directed transitions</text><path d="M850 466 L990 200" class="arrow"/><rect x="990" y="300" width="250" height="82" class="box" style="fill:#e8e8e8"/><text x="1115" y="324" text-anchor="middle" class="head">React/Leaflet API</text><text x="1115" y="348" text-anchor="middle" class="small">live snapshot</text><text x="1115" y="363" text-anchor="middle" class="small">map + route responses</text><rect x="1270" y="300" width="250" height="82" class="box" style="fill:#e8e8e8"/><text x="1395" y="324" text-anchor="middle" class="head">Federated process</text><text x="1395" y="348" text-anchor="middle" class="small">regional clients</text><text x="1395" y="363" text-anchor="middle" class="small">aggregation/status</text><path d="M850 186 L990 341" class="arrow"/><path d="M850 186 L1270 341" class="arrow"/><rect x="990" y="435" width="530" height="64" class="box" style="fill:#f2f2f2"/><text x="1255" y="459" text-anchor="middle" class="head">Layering rule</text><text x="1255" y="483" text-anchor="middle" class="small">endpoint never bypasses service/repository ownership; business logic stays in services</text></svg>