hicle_count</text><rect x="400" y="195" width="330" height="82" class="box" style="fill:#f2f2f2"/><text x="565" y="219" text-anchor="middle" class="head">BASELINE DEVIATIONS</text><text x="565" y="243" text-anchor="middle" class="small">speed_to_baseline</text><text x="565" y="258" text-anchor="middle" class="small">count_to_baseline</text><text x="565" y="273" text-anchor="middle" class="small">std_to_baseline</text><rect x="765" y="195" width="330" height="82" class="box" style="fill:#f2f2f2"/><text x="930" y="219" text-anchor="middle" class="head">PRIOR-WINDOW STATISTICS</text><text x="930" y="243" text-anchor="middle" class="small">prior_speed_mean_3</text><text x="930" y="258" text-anchor="middle" class="small">prior_count_mean_3</text><rect x="35" y="300" width="330" height="82" class="box" style="fill:#f2f2f2"/><text x="200" y="324" text-anchor="middle" class="head">TRENDS</text><text x="200" y="348" text-anchor="middle" class="small">speed_trend</text><text x="200" y="363" text-anchor="middle" class="small">count_trend</text><rect x="400" y="300" width="330" height="82" class="box" style="fill:#f2f2f2"/><text x="565" y="324" text-anchor="middle" class="head">LOW-SPEED PERSISTENCE</text><text x="565" y="348" text-anchor="middle" class="small">low_speed_persistence_3</text><rect x="765" y="300" width="330" height="82" class="box" style="fill:#e8e8e8"/><text x="930" y="324" text-anchor="middle" class="head">DIRECTED NEIGHBOR CONTEXT</text><text x="930" y="348" text-anchor="middle" class="small">neighbor_speed_delta</text><path d="M800 410 L800 450" class="arrow"/><rect x="450" y="450" width="700" height="75" class="box" style="fill:#dcdcdc"/><text x="800" y="474" text-anchor="middle" class="head">EXACT ORDERED 23-FEATURE VECTOR</text><text x="800" y="498" text-anchor="middle" class="small">current state + temporal + road metadata + baselines + deviations</text><text x="800" y="513" text-anchor="middle" class="small">prior windows + trends + persistence + directed neighbor_speed_delta</text><path d="M800 525 L800 565" class="arrow"/><rect x="450" y="565" width="700" height="72" class="box" style="fill:#f2f2f2"/><text x="800" y="589" text-anchor="middle" class="head">MODEL INPUT VALIDATION AND SCALING</text><text x="800" y="613" text-anchor="middle" class="small">feature order, finite values, positive scaler, metadata compatibility</text><text x="800" y="628" text-anchor="middle" class="small">forbidden runtime fields: labels, scenarios, event IDs, vehicle IDs, severity</text><path d="M800 637 L800 677" class="arrow"/><rect x="450" y="677" width="700" height="78" class="box" style="fill:#e8e8e8"/><text x="800" y="701" text-anchor="middle" class="head">FROZEN GEOV2MLP</text><text x="800" y="725" text-anchor="middle" class="small">input = 23 ordered values | evaluation mode</text><text x="800" y="740" text-anchor="middle" class="small">8-class probabilities: normal, congestion, construction, flood, road_block, road_damage, accident, diversion</text></svg>