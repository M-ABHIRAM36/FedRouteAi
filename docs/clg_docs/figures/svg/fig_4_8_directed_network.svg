<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#000"/></marker></defs><style>
.title{font-family:'Times New Roman',serif;font-weight:700;font-size:22px;fill:#000}
.head{font-family:'Times New Roman',serif;font-weight:700;font-size:15px;fill:#000}
.body{font-family:'Times New Roman',serif;font-size:13px;fill:#000}
.small{font-family:'Times New Roman',serif;font-size:11px;fill:#000}
.box{fill:#fff;stroke:#000;stroke-width:2}
.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#000;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><text x="750" y="35" text-anchor="middle" class="title">Directed Road Network and Transitions</text><rect x="90" y="130" width="250" height="90" class="box"/><text x="215.0" y="156" text-anchor="middle" class="head">Segment A</text><text x="215.0" y="182" text-anchor="middle" class="body">outgoing transition → B</text><rect x="625" y="130" width="250" height="90" class="box"/><text x="750.0" y="156" text-anchor="middle" class="head">Segment B</text><text x="750.0" y="182" text-anchor="middle" class="body">outgoing transition → C</text><rect x="1160" y="130" width="250" height="90" class="box"/><text x="1285.0" y="156" text-anchor="middle" class="head">Segment C</text><text x="1285.0" y="182" text-anchor="middle" class="body">terminal example</text><line x1="340" y1="175" x2="625" y2="175" class="arrow"/><line x1="875" y1="175" x2="1160" y2="175" class="arrow"/><rect x="360" y="320" width="780" height="100" class="box"/><text x="750.0" y="346" text-anchor="middle" class="head">Direction rule</text><text x="750.0" y="372" text-anchor="middle" class="body">A → B → C is legal when persisted as directed transitions</text><text x="750.0" y="390" text-anchor="middle" class="body">a reverse edge is separate and may be absent for one-way roads</text><path d="M625 225 C625 285 340 285 215 225" class="arrow"/><text x="410" y="275" class="small">optional reverse edge only when network contains it</text></svg>