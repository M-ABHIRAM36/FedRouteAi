</style><text x="800" y="32" text-anchor="middle" class="title">End-to-End Data Pipeline</text><text x="800" y="55" text-anchor="middle" class="small">Runtime telemetry becomes persisted traffic state and a label-free prediction; routing follows a separate directed-network branch.</text><rect x="25" y="82" width="1060" height="250" class="dash" fill="none"/><text x="39" y="104" class="head">RUNTIME INGESTION AND PREDICTION</text><rect x="50" y="145" width="125" height="110" class="box" style="fill:#e8e8e8"/><text x="112" y="169" text-anchor="middle" class="head">GPS telemetry</text><text x="112" y="193" text-anchor="middle" class="small">batch validation</text><text x="112" y="208" text-anchor="middle" class="small">timestamp + source</text><path d="M175 200 L195 200" class="arrow"/><rect x="195" y="145" width="125" height="110" class="box" style="fill:#f2f2f2"/><text x="257" y="169" text-anchor="middle" class="head">Segment association</text><text x="257" y="193" text-anchor="middle" class="small">canonical OSM/PostGIS</text><text x="257" y="208" text-anchor="middle" class="small">geometry continuity</text><path d="M320 200 L340 200" class="arrow"/><rect x="340" y="145" width="125" height="110" class="box" style="fill:#f2f2f2"/><text x="402" y="169" text-anchor="middle" class="head">Time-window state</text><text x="402" y="193" text-anchor="middle" class="small">speed/count/occupancy</text><text x="402" y="208" text-anchor="middle" class="small">segment projection</text><path d="M465 200 L485 200" class="arrow"/><rect x="485" y="145" width="125" height="110" class="box" style="fill:#f2f2f2"/><text x="547" y="169" text-anchor="middle" class="head">Historical memory</text><text x="547" y="193" text-anchor="middle" class="small">normal baselines</text><text x="547" y="208" text-anchor="middle" class="small">causal prior rows</text><path d="M610 200 L630 200" class="arrow"/><rect x="630" y="145" width="125" height="110" class="box" style="fill:#e8e8e8"/><text x="692" y="169" text-anchor="middle" class="head">Geo V2 features</text><text x="692" y="193" text-anchor="middle" class="small">history_spatial_strong</text><text x="692" y="208" text-anchor="middle" class="small">ordered 23 features</text><path d="M755 200 L775 200" class="arrow"/><rect x="775" y="145" width="125" height="110" class="box" style="fill:#e8e8e8"/><text x="837" y="169" text-anchor="middle" class="head">Artifact + MLP</text><text x="837" y="193" text-anchor="middle" class="small">compatibility check</text><text x="837" y="208" text-anchor="middle" class="small">8-class label-free inference</text><path d="M900 200 L920 200" class="arrow"/><rect x="920" y="145" width="125" height="110" class="box" style="fill:#f2f2f2"/><text x="982" y="169" text-anchor="middle" class="head">Prediction state</text><text x="982" y="193" text-anchor="middle" class="small">persist result</text><text x="982" y="208" text-anchor="middle" class="small">live snapshot/API</text><rect x="25" y="365" width="1060" height="170" class="dash" fill="none"/><text x="39" y="387" class="head">SEPARATE ROUTE BRANCH</text><rect x="60" y="415" width="210" height="76" class="box" style="fill:#dcdcdc"/><text x="165" y="439" text-anchor="middle" class="head">Origin / destination</text><text x="165" y="463" text-anchor="middle" class="small">validated coordinates</text><rect x="330" y="415" width="210" height="76" class="box" style="fill:#dcdcdc"/><text x="435" y="439" text-anchor="middle" class="head">Directed graph</text><text x="435" y="463" text-anchor="middle" class="small">canonical segments</text><text x="435" y="478" text-anchor="middle" class="small">persisted transitions</text><rect x="600" y="415" width="210" height="76" class="box" style="fill:#dcdcdc"/><text x="705" y="439" text-anchor="middle" class="head">Shortest route</text><text x="705" y="463" text-anchor="middle" class="small">distance-based default</text><text x="705" y="478" text-anchor="middle" class="small">event/exclusion inspection</text><rect x="870" y="415" width="180" height="76" class="box" style="fill:#dcdcdc"/><text x="960" y="439" text-anchor="middle" class="head">Route response</text><text x="960" y="463" text-anchor="middle" class="small">ordered IDs + geometry</text><path d="M270 453 L330 453" class="arrow"/><path d="M540 453 L600 453" class="arrow"/><path d="M810 453 L870 453" class="arrow"/><rect x="1135" y="82" width="440" height="453" class="dash" fill="none"/><text x="1149" y="104" class="head">PRESENTATION AND CONTROL SURFACES</text><rect x="1170" y="135" width="370" height="82" class="box" style="fill:#f2f2f2"/><text x="1355" y="159" text-anchor="middle" class="head">FastAPI endpoints</text><text x="1355" y="183" text-anchor="middle" class="small">ingest | prediction | events</text><text x="1355" y="198" text-anchor="middle" class="small">segments | routes | demo | metrics</text><rect x="1170" y="270" width="370" height="82" class="box" style="fill:#e8e8e8"/><text x="1355" y="294" text-anchor="middle" class="head">React + Leaflet</text><text x="1355" y="318" text-anchor="middle" class="small">network, vehicles, traffic, events</text><text x="1355" y="333" text-anchor="middle" class="small">predictions, routes, live scenarios</text><path d="M1355 217 L1355 270" class="arrow"/><rect x="1170" y="405" width="370" height="82" class="box" style="fill:#f2f2f2"/><text x="1355" y="429" text-anchor="middle" class="head">Reportable state</text><text x="1355" y="453" text-anchor="middle" class="small">API snapshots and route responses</text><text x="1355" y="468" text-anchor="middle" class="small">no labels in runtime feature input</text><path d="M1355 352 L1355 405" class="arrow"/></svg>