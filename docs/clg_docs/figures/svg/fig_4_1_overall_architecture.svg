</style><text x="800" y="32" text-anchor="middle" class="title">Overall System Architecture of FedRouteAI</text><text x="800" y="55" text-anchor="middle" class="small">Runtime inference, federated training, canonical network services, and presentation are separated by responsibility.</text><rect x="25" y="75" width="430" height="475" class="dash" fill="none"/><text x="39" y="97" class="head">A. TELEMETRY AND SPATIAL STATE</text><rect x="50" y="115" width="180" height="76" class="box" style="fill:#e8e8e8"/><text x="140" y="139" text-anchor="middle" class="head">GPS / live telemetry</text><text x="140" y="163" text-anchor="middle" class="small">validated batches</text><text x="140" y="178" text-anchor="middle" class="small">source_id, run_id, timestamp</text><rect x="250" y="115" width="180" height="76" class="box" style="fill:#e8e8e8"/><text x="340" y="139" text-anchor="middle" class="head">Segment association</text><text x="340" y="163" text-anchor="middle" class="small">canonical segment</text><text x="340" y="178" text-anchor="middle" class="small">continuity + geometry</text><path d="M230 153 L250 153" class="arrow"/><rect x="50" y="225" width="180" height="76" class="box" style="fill:#e8e8e8"/><text x="140" y="249" text-anchor="middle" class="head">Traffic aggregation</text><text x="140" y="273" text-anchor="middle" class="small">time-window state</text><text x="140" y="288" text-anchor="middle" class="small">speed, count, occupancy</text><rect x="250" y="225" width="180" height="76" class="box" style="fill:#e8e8e8"/><text x="340" y="249" text-anchor="middle" class="head">Historical memory</text><text x="340" y="273" text-anchor="middle" class="small">normal prehistory</text><text x="340" y="288" text-anchor="middle" class="small">causal prior rows</text><path d="M140 191 L140 225" class="arrow"/><path d="M340 191 L340 225" class="arrow"/><rect x="50" y="335" width="180" height="76" class="box" style="fill:#dcdcdc"/><text x="140" y="359" text-anchor="middle" class="head">Canonical network</text><text x="140" y="383" text-anchor="middle" class="small">OSM-derived geometry</text><text x="140" y="398" text-anchor="middle" class="small">metadata + directed edges</text><rect x="250" y="335" width="180" height="76" class="box" style="fill:#dcdcdc"/><text x="340" y="359" text-anchor="middle" class="head">PostgreSQL + PostGIS</text><text x="340" y="383" text-anchor="middle" class="small">pings, states, events</text><text x="340" y="398" text-anchor="middle" class="small">segments, transitions</text><path d="M140 301 L140 335" class="arrow"/><path d="M340 301 L340 335" class="arrow"/><rect x="50" y="445" width="380" height="76" class="box" style="fill:#f2f2f2"/><text x="240" y="469" text-anchor="middle" class="head">Network identity</text><text x="240" y="493" text-anchor="middle" class="small">beeramguda-osm-20260506</text><text x="240" y="508" text-anchor="middle" class="small">shared by association, spatial context, map, routing</text><path d="M240 411 L240 445" class="arrow"/><rect x="485" y="75" width="510" height="475" class="dash" fill="none"/><text x="499" y="97" class="head">B. GEO V2 RUNTIME INFERENCE</text><rect x="515" y="115" width="210" height="78" class="box" style="fill:#e8e8e8"/><text x="620" y="139" text-anchor="middle" class="head">Feature construction</text><text x="620" y="163" text-anchor="middle" class="small">history_spatial_strong</text><text x="620" y="178" text-anchor="middle" class="small">current + history + neighbor</text><rect x="755" y="115" width="210" height="78" class="box" style="fill:#f2f2f2"/><text x="860" y="139" text-anchor="middle" class="head">Ordered contract</text><text x="860" y="163" text-anchor="middle" class="small">23 features</text><text x="860" y="178" text-anchor="middle" class="small">label-free input</text><path d="M725 154 L755 154" class="arrow"/><rect x="515" y="230" width="210" height="78" class="box" style="fill:#f2f2f2"/><text x="620" y="254" text-anchor="middle" class="head">Artifact validation</text><text x="620" y="278" text-anchor="middle" class="small">feature order + scaler</text><text x="620" y="293" text-anchor="middle" class="small">metadata compatibility</text><rect x="755" y="230" width="210" height="78" class="box" style="fill:#e8e8e8"/><text x="860" y="254" text-anchor="middle" class="head">Frozen Geo V2 MLP</text><text x="860" y="278" text-anchor="middle" class="small">8 classes</text><text x="860" y="293" text-anchor="middle" class="small">evaluation mode</text><path d="M620 193 L620 230" class="arrow"/><path d="M860 193 L860 230" class="arrow"/><path d="M725 269 L755 269" class="arrow"/><rect x="515" y="345" width="210" height="78" class="box" style="fill:#e8e8e8"/><text x="620" y="369" text-anchor="middle" class="head">Prediction state</text><text x="620" y="393" text-anchor="middle" class="small">probabilities + status</text><text x="620" y="408" text-anchor="middle" class="small">events / coverage</text><rect x="755" y="345" width="210" height="78" class="box" style="fill:#dcdcdc"/><text x="860" y="369" text-anchor="middle" class="head">Persistence</text><text x="860" y="393" text-anchor="middle" class="small">prediction records</text><text x="860" y="408" text-anchor="middle" class="small">live snapshot</text><path d="M620 308 L620 345" class="arrow"/><path d="M860 308 L860 345" class="arrow"/><path d="M725 384 L755 384" class="arrow"/><rect x="515" y="460" width="450" height="64" class="box" style="fill:#f2f2f2"/><text x="740" y="484" text-anchor="middle" class="head">FastAPI service boundary</text><text x="740" y="508" text-anchor="middle" class="small">prediction, ingest, events, segments, metrics, demo</text><path d="M740 423 L740 460" class="arrow"/><rect x="1005" y="75" width="570" height="475" class="dash" fill="none"/><text x="1019" y="97" class="head">C. FEDERATED TRAINING AND DELIVERY</text><rect x="1035" y="115" width="230" height="78" class="box" style="fill:#e8e8e8"/><text x="1150" y="139" text-anchor="middle" class="head">REGION_01 ... REGION_08</text><text x="1150" y="163" text-anchor="middle" class="small">regional data remains local</text><text x="1150" y="178" text-anchor="middle" class="small">local preprocessing + MLP</text><rect x="1315" y="115" width="230" height="78" class="box" style="fill:#e8e8e8"/><text x="1430" y="139" text-anchor="middle" class="head">Local updates</text><text x="1430" y="163" text-anchor="middle" class="small">parameters + metadata</text><text x="1430" y="178" text-anchor="middle" class="small">no raw GPS upload</text><path d="M1265 154 L1315 154" class="arrow"/><rect x="1035" y="230" width="230" height="78" class="box" style="fill:#f2f2f2"/><text x="1150" y="254" text-anchor="middle" class="head">Adaptive FedAvg family</text><text x="1150" y="278" text-anchor="middle" class="small">server-side aggregation</text><text x="1150" y="293" text-anchor="middle" class="small">bounded client weighting</text><rect x="1315" y="230" width="230" height="78" class="box" style="fill:#f2f2f2"/><text x="1430" y="254" text-anchor="middle" class="head">Global candidate</text><text x="1430" y="278" text-anchor="middle" class="small">round history</text><text x="1430" y="293" text-anchor="middle" class="small">validation selection</text><path d="M1150 193 L1150 230" class="arrow"/><path d="M1430 193 L1430 230" class="arrow"/><path d="M1265 269 L1315 269" class="arrow"/><rect x="1035" y="345" width="510" height="78" class="box" style="fill:#dcdcdc"/><text x="1290" y="369" text-anchor="middle" class="head">Versioned deployment artifact</text><text x="1290" y="393" text-anchor="middle" class="small">selected checkpoint + scaler + schema + provenance</text><text x="1290" y="408" text-anchor="middle" class="small">runtime loads only compatible artifact</text><path d="M1290 308 L1290 345" class="arrow"/><rect x="1035" y="460" width="510" height="64" class="box" style="fill:#e8e8e8"/><text x="1290" y="484" text-anchor="middle" class="head">Distribution</text><text x="1290" y="508" text-anchor="middle" class="small">global parameters/checkpoint available to regional clients and runtime</text><path d="M1290 423 L1290 460" class="arrow"/><path d="M1035 492 L985 492 L985 154 L965 154" class="arrow"/><text x="1000" y="485" text-anchor="middle" class="small">artifact</text><text x="800" y="580" text-anchor="middle" class="small">Presentation and routing consume persisted state and canonical network services; routing is not ML inference.</text></svg>