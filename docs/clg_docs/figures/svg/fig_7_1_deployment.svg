</style><text x="800" y="32" text-anchor="middle" class="title">Local Deployment Architecture</text><text x="800" y="55" text-anchor="middle" class="small">Local academic prototype: frontend, backend, database/network state, and versioned ML artifact are run as coordinated processes.</text><rect x="35" y="95" width="650" height="400" class="dash" fill="none"/><text x="49" y="117" class="head">PRESENTATION AND APPLICATION HOST</text><rect x="75" y="155" width="250" height="100" class="box" style="fill:#e8e8e8"/><text x="200" y="179" text-anchor="middle" class="head">React + Vite frontend</text><text x="200" y="203" text-anchor="middle" class="small">Leaflet map</text><text x="200" y="218" text-anchor="middle" class="small">live vehicles / routes / demos</text><text x="200" y="233" text-anchor="middle" class="small">browser client</text><rect x="395" y="155" width="250" height="100" class="box" style="fill:#e8e8e8"/><text x="520" y="179" text-anchor="middle" class="head">FastAPI backend</text><text x="520" y="203" text-anchor="middle" class="small">API routers</text><text x="520" y="218" text-anchor="middle" class="small">services + repositories</text><text x="520" y="233" text-anchor="middle" class="small">runtime Geo V2 inference</text><path d="M325 205 L395 205" class="arrow"/><text x="360" y="198" text-anchor="middle" class="small">HTTP API</text><rect x="175" y="335" width="390" height="86" class="box" style="fill:#f2f2f2"/><text x="370" y="359" text-anchor="middle" class="head">run_project.py / local scripts</text><text x="370" y="383" text-anchor="middle" class="small">backend from backend/</text><text x="370" y="398" text-anchor="middle" class="small">frontend from frontend/</text><text x="370" y="413" text-anchor="middle" class="small">dataset, replay, training support</text><path d="M520 255 L520 335" class="arrow"/><rect x="755" y="95" width="805" height="400" class="dash" fill="none"/><text x="769" y="117" class="head">DATA, NETWORK, AND MODEL ARTIFACTS</text><rect x="795" y="155" width="235" height="100" class="box" style="fill:#dcdcdc"/><text x="912" y="179" text-anchor="middle" class="head">PostgreSQL + PostGIS</text><text x="912" y="203" text-anchor="middle" class="small">pings / memory / events</text><text x="912" y="218" text-anchor="middle" class="small">segments + transitions</text><text x="912" y="233" text-anchor="middle" class="small">live/prediction state</text><rect x="1080" y="155" width="205" height="100" class="box" style="fill:#dcdcdc"/><text x="1182" y="179" text-anchor="middle" class="head">OSM-derived network</text><text x="1182" y="203" text-anchor="middle" class="small">geometry</text><text x="1182" y="218" text-anchor="middle" class="small">metadata</text><text x="1182" y="233" text-anchor="middle" class="small">network version</text><rect x="1335" y="155" width="190" height="100" class="box" style="fill:#e8e8e8"/><text x="1430" y="179" text-anchor="middle" class="head">Geo V2 artifact</text><text x="1430" y="203" text-anchor="middle" class="small">best_model.pt</text><text x="1430" y="218" text-anchor="middle" class="small">scaler + schema</text><text x="1430" y="233" text-anchor="middle" class="small">provenance metadata</text><path d="M645 205 L795 205" class="arrow"/><text x="720" y="198" text-anchor="middle" class="small">SQL/PostGIS</text><path d="M1030 205 L1080 205" class="arrow"/><path d="M1285 205 L1335 205" class="arrow"/><rect x="850" y="335" width="570" height="86" class="box" style="fill:#f2f2f2"/><text x="1135" y="359" text-anchor="middle" class="head">Shared local contract</text><text x="1135" y="383" text-anchor="middle" class="small">network version + 23-feature order + model metadata</text><text x="1135" y="398" text-anchor="middle" class="small">artifact validation fails closed for mismatch</text><path d="M1180 255 L1180 335" class="arrow"/><text x="800" y="475" text-anchor="middle" class="small">No cloud infrastructure, formal privacy mechanism, or unattended safety-critical deployment is implied.</text></svg>