</style><text x="800" y="32" text-anchor="middle" class="title">Directed Shortest-Path Routing</text><text x="800" y="55" text-anchor="middle" class="small">Default cost is distance on the canonical directed network; Geo V2 predictions support inspection/coverage and explicit event penalties, not learned route optimization.</text><rect x="35" y="90" width="1030" height="430" class="dash" fill="none"/><text x="49" y="112" class="head">ROUTE COMPUTATION</text><rect x="70" y="160" width="205" height="92" class="box" style="fill:#e8eef2"/><text x="172" y="184" text-anchor="middle" class="head">Origin + destination</text><text x="172" y="208" text-anchor="middle" class="small">validated coordinates</text><text x="172" y="223" text-anchor="middle" class="small">network version</text><rect x="335" y="160" width="205" height="92" class="box" style="fill:#f2f2f2"/><text x="437" y="184" text-anchor="middle" class="head">Snap to segments</text><text x="437" y="208" text-anchor="middle" class="small">nearest canonical geometry</text><text x="437" y="223" text-anchor="middle" class="small">start/end segment IDs</text><rect x="600" y="160" width="205" height="92" class="box" style="fill:#f4eee5"/><text x="702" y="184" text-anchor="middle" class="head">Directed graph</text><text x="702" y="208" text-anchor="middle" class="small">segments + transitions</text><text x="702" y="223" text-anchor="middle" class="small">cached by network identity</text><rect x="865" y="160" width="165" height="92" class="box" style="fill:#f4eee5"/><text x="947" y="184" text-anchor="middle" class="head">Dijkstra / A*</text><text x="947" y="208" text-anchor="middle" class="small">distance cost</text><text x="947" y="223" text-anchor="middle" class="small">legal edges</text><path d="M275 206 L335 206" class="arrow"/><path d="M540 206 L600 206" class="arrow"/><path d="M805 206 L865 206" class="arrow"/><rect x="220" y="315" width="250" height="92" class="box" style="fill:#e8eef2"/><text x="345" y="339" text-anchor="middle" class="head">Ordered segment IDs</text><text x="345" y="363" text-anchor="middle" class="small">directed path result</text><text x="345" y="378" text-anchor="middle" class="small">transition order preserved</text><rect x="520" y="315" width="250" height="92" class="box" style="fill:#e8eef2"/><text x="645" y="339" text-anchor="middle" class="head">Route geometry</text><text x="645" y="363" text-anchor="middle" class="small">ordered OSM segment geometry</text><text x="645" y="378" text-anchor="middle" class="small">map-ready polyline</text><rect x="820" y="315" width="210" height="92" class="box" style="fill:#f2f2f2"/><text x="925" y="339" text-anchor="middle" class="head">Distance + duration</text><text x="925" y="363" text-anchor="middle" class="small">response metrics</text><text x="925" y="378" text-anchor="middle" class="small">route inspection</text><path d="M947 252 L345 315" class="arrow"/><path d="M470 361 L520 361" class="arrow"/><path d="M770 361 L820 361" class="arrow"/><rect x="1110" y="90" width="450" height="430" class="dash" fill="none"/><text x="1124" y="112" class="head">PREDICTION-AWARE INSPECTION</text><rect x="1145" y="160" width="380" height="92" class="box" style="fill:#e8eef2"/><text x="1335" y="184" text-anchor="middle" class="head">Latest prediction coverage</text><text x="1335" y="208" text-anchor="middle" class="small">covered segments</text><text x="1335" y="223" text-anchor="middle" class="small">abnormal segment count</text><text x="1335" y="238" text-anchor="middle" class="small">warnings</text><rect x="1145" y="300" width="380" height="92" class="box" style="fill:#f4eee5"/><text x="1335" y="324" text-anchor="middle" class="head">Separate optional behavior</text><text x="1335" y="348" text-anchor="middle" class="small">active-event penalties / explicit exclusions</text><text x="1335" y="363" text-anchor="middle" class="small">recommended route around known events</text><path d="M1335 252 L1335 300" class="arrow"/><text x="1335" y="460" text-anchor="middle" class="small">No claim that the MLP directly learns route cost.</text></svg>