<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#000"/></marker></defs><style>
.title{font-family:'Times New Roman',serif;font-weight:700;font-size:22px;fill:#000}
.head{font-family:'Times New Roman',serif;font-weight:700;font-size:15px;fill:#000}
.body{font-family:'Times New Roman',serif;font-size:13px;fill:#000}
.small{font-family:'Times New Roman',serif;font-size:11px;fill:#000}
.box{fill:#fff;stroke:#000;stroke-width:2}
.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#000;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><text x="800" y="32" text-anchor="middle" class="title">Live GPS Ingestion Pipeline</text><text x="800" y="55" text-anchor="middle" class="small">Append-only telemetry history is separated from the current segment-state projection used by live snapshots.</text><rect x="35" y="90" width="1030" height="440" class="dash" fill="none"/><text x="49" y="112" class="head">LIVE INGESTION AND PREDICTION</text><rect x="55" y="145" width="205" height="90" class="box" style="fill:#e8eef2"/><text x="157" y="169" text-anchor="middle" class="head">Telemetry batch</text><text x="157" y="193" text-anchor="middle" class="small">one device trajectory</text><text x="157" y="208" text-anchor="middle" class="small">GPS observations</text><path d="M260 190 L300 190" class="arrow"/><rect x="300" y="145" width="205" height="90" class="box" style="fill:#f2f2f2"/><text x="402" y="169" text-anchor="middle" class="head">Validation</text><text x="402" y="193" text-anchor="middle" class="small">schema + coordinates</text><text x="402" y="208" text-anchor="middle" class="small">receipt / run identity</text><path d="M505 190 L545 190" class="arrow"/><rect x="545" y="145" width="205" height="90" class="box" style="fill:#f2f2f2"/><text x="647" y="169" text-anchor="middle" class="head">Append history</text><text x="647" y="193" text-anchor="middle" class="small">persist GPS pings</text><text x="647" y="208" text-anchor="middle" class="small">audit trail</text><path d="M750 190 L790 190" class="arrow"/><rect x="790" y="145" width="205" height="90" class="box" style="fill:#f2f2f2"/><text x="892" y="169" text-anchor="middle" class="head">Segment state</text><text x="892" y="193" text-anchor="middle" class="small">map-match</text><text x="892" y="208" text-anchor="middle" class="small">current segment projection</text><path d="M995 190 L1035 190" class="arrow"/><rect x="55" y="290" width="205" height="90" class="box" style="fill:#f2f2f2"/><text x="157" y="314" text-anchor="middle" class="head">Aggregate</text><text x="157" y="338" text-anchor="middle" class="small">time-window traffic</text><text x="157" y="353" text-anchor="middle" class="small">speed/count features</text><rect x="300" y="290" width="205" height="90" class="box" style="fill:#e8eef2"/><text x="402" y="314" text-anchor="middle" class="head">Geo V2 inference</text><text x="402" y="338" text-anchor="middle" class="small">history + spatial context</text><text x="402" y="353" text-anchor="middle" class="small">23 ordered label-free values</text><rect x="545" y="290" width="205" height="90" class="box" style="fill:#e8eef2"/><text x="647" y="314" text-anchor="middle" class="head">Snapshot</text><text x="647" y="338" text-anchor="middle" class="small">prediction persistence</text><text x="647" y="353" text-anchor="middle" class="small">vehicles/events/map state</text><path d="M1020 190 L1020 290" class="arrow"/><path d="M260 235 L260 290" class="arrow"/><rect x="55" y="335" width="430" height="82" class="box" style="fill:#f4eee5"/><text x="270" y="359" text-anchor="middle" class="head">Append-only telemetry path</text><text x="270" y="383" text-anchor="middle" class="small">raw GPS pings remain historical records</text><text x="270" y="398" text-anchor="middle" class="small">used for replay, memory building, and audit</text><rect x="570" y="335" width="430" height="82" class="box" style="fill:#e8eef2"/><text x="785" y="359" text-anchor="middle" class="head">Current-state projection</text><text x="785" y="383" text-anchor="middle" class="small">latest segment traffic/prediction state</text><text x="785" y="398" text-anchor="middle" class="small">served by scoped live snapshots</text><text x="800" y="485" text-anchor="middle" class="small">Background orchestration may trigger detection; runtime inference does not consume event labels or scenario names.</text><rect x="1110" y="90" width="450" height="440" class="dash" fill="none"/><text x="1124" y="112" class="head">PERSISTED OUTPUTS</text><rect x="1145" y="160" width="380" height="92" class="box" style="fill:#f4eee5"/><text x="1335" y="184" text-anchor="middle" class="head">PostgreSQL + PostGIS</text><text x="1335" y="208" text-anchor="middle" class="small">gps_pings | live_ingestion</text><text x="1335" y="223" text-anchor="middle" class="small">historical_memory | predictions</text><text x="1335" y="238" text-anchor="middle" class="small">events | segments</text><rect x="1145" y="315" width="380" height="92" class="box" style="fill:#e8eef2"/><text x="1335" y="339" text-anchor="middle" class="head">API snapshot</text><text x="1335" y="363" text-anchor="middle" class="small">map geometry + vehicles</text><text x="1335" y="378" text-anchor="middle" class="small">traffic state + predictions</text><text x="1335" y="393" text-anchor="middle" class="small">event and route state</text><path d="M1335 252 L1335 315" class="arrow"/></svg>