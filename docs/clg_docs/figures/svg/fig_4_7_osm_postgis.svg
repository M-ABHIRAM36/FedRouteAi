</style><text x="800" y="32" text-anchor="middle" class="title">OSM/PostGIS Network Import</text><text x="800" y="55" text-anchor="middle" class="small">OSM supplies road structure, geometry, metadata, and topology; it is not the ML training dataset.</text><rect x="35" y="90" width="530" height="430" class="dash" fill="none"/><text x="49" y="112" class="head">INGEST AND NORMALIZE</text><rect x="70" y="145" width="210" height="82" class="box" style="fill:#e8eef2"/><text x="175" y="169" text-anchor="middle" class="head">OpenStreetMap source</text><text x="175" y="193" text-anchor="middle" class="small">road geometry</text><text x="175" y="208" text-anchor="middle" class="small">road attributes</text><rect x="320" y="145" width="210" height="82" class="box" style="fill:#f2f2f2"/><text x="425" y="169" text-anchor="middle" class="head">Cached road data</text><text x="425" y="193" text-anchor="middle" class="small">repeatable import input</text><text x="425" y="208" text-anchor="middle" class="small">network source identity</text><path d="M280 186 L320 186" class="arrow"/><rect x="70" y="280" width="210" height="82" class="box" style="fill:#f4eee5"/><text x="175" y="304" text-anchor="middle" class="head">Network normalization</text><text x="175" y="328" text-anchor="middle" class="small">canonical segment IDs</text><text x="175" y="343" text-anchor="middle" class="small">road metadata</text><rect x="320" y="280" width="210" height="82" class="box" style="fill:#f4eee5"/><text x="425" y="304" text-anchor="middle" class="head">Directed topology</text><text x="425" y="328" text-anchor="middle" class="small">legal transitions</text><text x="425" y="343" text-anchor="middle" class="small">one-way direction</text><path d="M175 227 L175 280" class="arrow"/><path d="M425 227 L425 280" class="arrow"/><rect x="155" y="415" width="310" height="64" class="box" style="fill:#f2f2f2"/><text x="310" y="439" text-anchor="middle" class="head">Canonical network manifest</text><text x="310" y="463" text-anchor="middle" class="small">beeramguda-osm-20260506</text><path d="M280 362 L280 415" class="arrow"/><rect x="625" y="90" width="935" height="430" class="dash" fill="none"/><text x="639" y="112" class="head">POSTGIS PERSISTENCE AND SHARED CONSUMERS</text><rect x="665" y="150" width="280" height="96" class="box" style="fill:#f4eee5"/><text x="805" y="174" text-anchor="middle" class="head">PostgreSQL + PostGIS</text><text x="805" y="198" text-anchor="middle" class="small">segments and geometry</text><text x="805" y="213" text-anchor="middle" class="small">metadata and transitions</text><text x="805" y="228" text-anchor="middle" class="small">spatial indexes</text><path d="M565 447 L665 198" class="arrow"/><rect x="1030" y="125" width="220" height="82" class="box" style="fill:#e8eef2"/><text x="1140" y="149" text-anchor="middle" class="head">Segment association</text><text x="1140" y="173" text-anchor="middle" class="small">GPS -&gt; canonical segment</text><path d="M945 198 L1030 166" class="arrow"/><rect x="1300" y="125" width="220" height="82" class="box" style="fill:#e8eef2"/><text x="1410" y="149" text-anchor="middle" class="head">Spatial feature context</text><text x="1410" y="173" text-anchor="middle" class="small">directed neighbor speed</text><path d="M945 198 L1300 166" class="arrow"/><rect x="1030" y="305" width="220" height="82" class="box" style="fill:#e8eef2"/><text x="1140" y="329" text-anchor="middle" class="head">Map rendering</text><text x="1140" y="353" text-anchor="middle" class="small">geometry + live state</text><path d="M945 198 L1030 346" class="arrow"/><rect x="1300" y="305" width="220" height="82" class="box" style="fill:#e8eef2"/><text x="1410" y="329" text-anchor="middle" class="head">Directed routing</text><text x="1410" y="353" text-anchor="middle" class="small">graph + transitions</text><path d="M945 198 L1300 346" class="arrow"/><text x="1090" y="475" text-anchor="middle" class="small">The canonical network is the shared spatial reference for ML context, persistence, map display, and routing.</text></svg>