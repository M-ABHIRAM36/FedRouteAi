</style><text x="800" y="32" text-anchor="middle" class="title">Frontend Map and API Interaction</text><text x="800" y="55" text-anchor="middle" class="small">React owns presentation state; inference, persistence, network topology, and routing remain backend responsibilities.</text><rect x="35" y="90" width="590" height="460" class="dash" fill="none"/><text x="49" y="112" class="head">REACT APPLICATION</text><rect x="70" y="145" width="240" height="80" class="box" style="fill:#e8e8e8"/><text x="190" y="169" text-anchor="middle" class="head">React application</text><text x="190" y="193" text-anchor="middle" class="small">scenario controls</text><text x="190" y="208" text-anchor="middle" class="small">live state + route state</text><rect x="350" y="145" width="240" height="80" class="box" style="fill:#f2f2f2"/><text x="470" y="169" text-anchor="middle" class="head">API client</text><text x="470" y="193" text-anchor="middle" class="small">typed requests</text><text x="470" y="208" text-anchor="middle" class="small">polling / action endpoints</text><path d="M310 185 L350 185" class="arrow"/><rect x="70" y="280" width="240" height="96" class="box" style="fill:#e8e8e8"/><text x="190" y="304" text-anchor="middle" class="head">Leaflet map</text><text x="190" y="328" text-anchor="middle" class="small">road network layer</text><text x="190" y="343" text-anchor="middle" class="small">vehicles + traffic state</text><text x="190" y="358" text-anchor="middle" class="small">predictions + events</text><rect x="350" y="280" width="240" height="96" class="box" style="fill:#e8e8e8"/><text x="470" y="304" text-anchor="middle" class="head">Route / demo views</text><text x="470" y="328" text-anchor="middle" class="small">ordered route geometry</text><text x="470" y="343" text-anchor="middle" class="small">coverage + inspection</text><text x="470" y="358" text-anchor="middle" class="small">live vehicle visualization</text><path d="M190 225 L190 280" class="arrow"/><path d="M470 225 L470 280" class="arrow"/><rect x="160" y="430" width="300" height="64" class="box" style="fill:#f2f2f2"/><text x="310" y="454" text-anchor="middle" class="head">Presentation state</text><text x="310" y="478" text-anchor="middle" class="small">map layers compose API snapshots; no model logic in UI</text><path d="M330 376 L310 430" class="arrow"/><rect x="685" y="90" width="875" height="460" class="dash" fill="none"/><text x="699" y="112" class="head">BACKEND API AND DATA SERVICES</text><rect x="725" y="145" width="360" height="82" class="box" style="fill:#f2f2f2"/><text x="905" y="169" text-anchor="middle" class="head">FastAPI endpoints</text><text x="905" y="193" text-anchor="middle" class="small">live map | ingest | prediction | events</text><text x="905" y="208" text-anchor="middle" class="small">segments | routes | Geo V2 demo</text><rect x="1150" y="145" width="360" height="82" class="box" style="fill:#dcdcdc"/><text x="1330" y="169" text-anchor="middle" class="head">Backend services</text><text x="1330" y="193" text-anchor="middle" class="small">feature/inference | repositories</text><text x="1330" y="208" text-anchor="middle" class="small">directed routing | snapshot assembly</text><path d="M1085 186 L1150 186" class="arrow"/><rect x="725" y="285" width="360" height="96" class="box" style="fill:#e8e8e8"/><text x="905" y="309" text-anchor="middle" class="head">Live and prediction responses</text><text x="905" y="333" text-anchor="middle" class="small">vehicles, segment state, events</text><text x="905" y="348" text-anchor="middle" class="small">probabilities, confidence, coverage</text><rect x="1150" y="285" width="360" height="96" class="box" style="fill:#e8e8e8"/><text x="1330" y="309" text-anchor="middle" class="head">Network and route responses</text><text x="1330" y="333" text-anchor="middle" class="small">canonical geometry + metadata</text><text x="1330" y="348" text-anchor="middle" class="small">ordered IDs, distance, duration</text><path d="M905 227 L905 285" class="arrow"/><path d="M1330 227 L1330 285" class="arrow"/><rect x="915" y="440" width="360" height="64" class="box" style="fill:#f2f2f2"/><text x="1095" y="464" text-anchor="middle" class="head">Leaflet layer update</text><text x="1095" y="488" text-anchor="middle" class="small">network | traffic | vehicles | predictions | events | routes</text><path d="M1085 381 L1095 440" class="arrow"/></svg>