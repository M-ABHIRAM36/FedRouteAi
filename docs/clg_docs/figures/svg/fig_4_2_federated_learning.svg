"middle" class="small">distribute parameters</text><text x="1370" y="498" text-anchor="middle" class="small">clients continue local training</text><path d="M1370 382 L1370 435" class="arrow"/><path d="M1200 476 L1115 476 L1115 120 L635 120" class="arrow"/><text x="1120" y="466" text-anchor="middle" class="small">parameters only</text></svg>