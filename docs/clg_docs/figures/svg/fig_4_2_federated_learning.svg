</style><text x="800" y="32" text-anchor="middle" class="title">Federated Learning Architecture</text><text x="800" y="55" text-anchor="middle" class="small">Eight geographic clients compute locally; only model updates and training metadata cross the aggregation boundary.</text><rect x="25" y="78" width="610" height="480" class="dash" fill="none"/><text x="39" y="100" class="head">REGIONAL CLIENTS: LOCAL DATA AND LOCAL TRAINING</text><rect x="55" y="115" width="250" height="68" class="box" style="fill:#e8e8e8"/><text x="180" y="139" text-anchor="middle" class="head">REGION_01</text><text x="180" y="163" text-anchor="middle" class="small">regional telemetry/history</text><text x="180" y="178" text-anchor="middle" class="small">Geo V2 features -&gt; local MLP</text><path d="M180 183 L720 260" class="arrow"/><rect x="340" y="115" width="250" height="68" class="box" style="fill:#e8e8e8"/><text x="465" y="139" text-anchor="middle" class="head">REGION_02</text><text x="465" y="163" text-anchor="middle" class="small">regional telemetry/history</text><text x="465" y="178" text-anchor="middle" class="small">Geo V2 features -&gt; local MLP</text><path d="M465 183 L720 260" class="arrow"/><rect x="55" y="207" width="250" height="68" class="box" style="fill:#e8e8e8"/><text x="180" y="231" text-anchor="middle" class="head">REGION_03</text><text x="180" y="255" text-anchor="middle" class="small">regional telemetry/history</text><text x="180" y="270" text-anchor="middle" class="small">Geo V2 features -&gt; local MLP</text><path d="M180 275 L720 260" class="arrow"/><rect x="340" y="207" width="250" height="68" class="box" style="fill:#e8e8e8"/><text x="465" y="231" text-anchor="middle" class="head">REGION_04</text><text x="465" y="255" text-anchor="middle" class="small">regional telemetry/history</text><text x="465" y="270" text-anchor="middle" class="small">Geo V2 features -&gt; local MLP</text><path d="M465 275 L720 260" class="arrow"/><rect x="55" y="299" width="250" height="68"