<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>
.title{font-family:'Times New Roman',serif;font-weight:700;font-size:22px;fill:#000}
.head{font-family:'Times New Roman',serif;font-weight:700;font-size:15px;fill:#000}
.body{font-family:'Times New Roman',serif;font-size:13px;fill:#000}
.small{font-family:'Times New Roman',serif;font-size:11px;fill:#000}
.box{fill:#fff;stroke:#000;stroke-width:2}
.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#000;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><text x="800" y="32" text-anchor="middle" class="title">Regional Client and Server Interaction</text><text x="800" y="55" text-anchor="middle" class="small">The training lifecycle is split into an explicit client boundary and an aggregation server boundary.</text><rect x="25" y="85" width="700" height="470" class="dash" fill="none"/><text x="39" y="107" class="head">CLIENT PROCESS: ONE REGION</text><rect x="55" y="130" width="280" height="76" class="box" style="fill:#e8e8e8"/><text x="195" y="154" text-anchor="middle" class="head">Regional dataset</text><text x="195" y="178" text-anchor="middle" class="small">local feature tables</text><text x="195" y="193" text-anchor="middle" class="small">labels used only for training/evaluation</text><rect x="390" y="130" width="280" height="76" class="box" style="fill:#e8e8e8"/><text x="530" y="154" text-anchor="middle" class="head">Preprocess + feature build</text><text x="530" y="178" text-anchor="middle" class="small">normalization</text><text x="530" y="193" text-anchor="middle" class="small">Geo V2 ordered 23-feature rows</text><path d="M335 168 L390 168" class="arrow"/><rect x="55" y="250" width="280" height="76" class="box" style="fill:#e8e8e8"/><text x="195" y="274" text-anchor="middle" class="head">Local MLP</text><text x="195" y="298" text-anchor="middle" class="small">local epochs</text><text x="195" y="313" text-anchor="middle" class="small">class-aware training configuration</text><rect x="390" y="250" width="280" height="76" class="box" style="fill:#f2f2f2"/><text x="530" y="274" text-anchor="middle" class="head">Evaluation</text><text x="530" y="298" text-anchor="middle" class="small">local metrics</text><text x="530" y="313" text-anchor="middle" class="small">sample count + metadata</text><path d="M195 206 L195 250" class="arrow"/><path d="M530 206 L530 250" class="arrow"/><rect x="220" y="380" width="280" height="82" class="box" style="fill:#dcdcdc"/><text x="360" y="404" text-anchor="middle" class="head">Client update</text><text x="360" y="428" text-anchor="middle" class="small">model parameter arrays</text><text x="360" y="443" text-anchor="middle" class="small">no raw regional rows</text><path d="M335 288 L335 380" class="arrow"/><rect x="55" y="490" width="615" height="42" class="box" style="fill:#f2f2f2"/><text x="362" y="514" text-anchor="middle" class="head">Receive global parameters for the next round</text><path d="M500 462 L620 462 L620 511 L670 511" class="arrow"/><rect x="785" y="85" width="790" height="470" class="dash" fill="none"/><text x="799" y="107" class="head">SERVER PROCESS: FEDERATED COORDINATION</text><rect x="825" y="135" width="300" height="76" class="box" style="fill:#f2f2f2"/><text x="975" y="159" text-anchor="middle" class="head">Collect updates</text><text x="975" y="183" text-anchor="middle" class="small">all participating region updates</text><text x="975" y="198" text-anchor="middle" class="small">round and quality metadata</text><rect x="1200" y="135" width="300" height="76" class="box" style="fill:#dcdcdc"/><text x="1350" y="159" text-anchor="middle" class="head">Aggregate parameters</text><text x="1350" y="183" text-anchor="middle" class="small">FedAvg-family / adaptive aggregation</text><text x="1350" y="198" text-anchor="middle" class="small">bounded weights as configured</text><path d="M1125 173 L1200 173" class="arrow"/><rect x="825" y="265" width="675" height="78" class="box" style="fill:#e8e8e8"/><text x="1162" y="289" text-anchor="middle" class="head">Global model</text><text x="1162" y="313" text-anchor="middle" class="small">candidate checkpoint, validation selection, artifact metadata</text><path d="M1350 211 L1350 265" class="arrow"/><rect x="825" y="395" width="300" height="76" class="box" style="fill:#f2f2f2"/><text x="975" y="419" text-anchor="middle" class="head">Persist round state</text><text x="975" y="443" text-anchor="middle" class="small">round record + metrics</text><text x="975" y="458" text-anchor="middle" class="small">checkpoint history</text><rect x="1200" y="395" width="300" height="76" class="box" style="fill:#e8e8e8"/><text x="1350" y="419" text-anchor="middle" class="head">Synchronize clients</text><text x="1350" y="443" text-anchor="middle" class="small">global parameters</text><text x="1350" y="458" text-anchor="middle" class="small">next local round</text><path d="M1350 343 L975 395" class="arrow"/><path d="M1350 343 L1350 395" class="arrow"/><path d="M1200 433 L750 433 L750 511 L670 511" class="arrow"/></svg>